<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-bg"></div>

  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">Live weather updates</p>
      <h1>Weather Dashboard</h1>
      <p class="subtitle">Search any city or use your current location.</p>
    </div>

    <form class="search-bar" id="searchForm">
      <label class="sr-only" for="cityInput">Search city</label>
      <input
        id="cityInput"
        type="text"
        placeholder="Enter city name"
        autocomplete="off"
      >
      <button type="submit" class="primary-button">Search</button>
      <button type="button" class="secondary-button" id="locationBtn">Current Location</button>
    </form>
  </header>

  
  <main class="dashboard">
    <section class="weather-card glass-card fade-in" aria-labelledby="currentWeatherTitle">
      <div class="card-head">
        <div>
          <p class="section-label">Current Weather</p>
          <h2 id="currentWeatherTitle" class="city-name">Loading...</h2>
          <p id="dateTime" class="date-time">--</p>
        </div>
        <img id="weatherIcon" class="weather-icon" src="" alt="" aria-hidden="true">
      </div>

      <div class="weather-main">
        <div class="temperature-row">
          <span id="temperature" class="temperature">--</span>
          <span class="temperature-unit">°C</span>
        </div>
        <p id="weatherDescription" class="weather-description">Fetching weather data...</p>
        <p id="feelsLike" class="feels-like">Feels like --</p>
      </div>
      
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Humidity</span>
          <span id="humidity" class="stat-value">--%</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Wind Speed</span>
          <span id="windSpeed" class="stat-value">-- m/s</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Pressure</span>
          <span id="pressure" class="stat-value">-- hPa</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Visibility</span>
          <span id="visibility" class="stat-value">-- km</span>
        </div>
      </div>
    </section>
